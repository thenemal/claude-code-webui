# Add this block to the Caddyfile on the Caddy LXC.
# Replace claude.yourdomain.com with your actual domain.
# The webui has no built-in auth — basic_auth here is the only gate.

home9.compagnie-lily.org {
    reverse_proxy 192.168.45.20:9090

    basic_auth {
        # Generate hash: caddy hash-password --plaintext yourpassword
        seb $2a$14$...replace_with_caddy_hash...
    }
}
